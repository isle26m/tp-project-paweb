<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1000">
  <title>Algeria Map</title>
</head>
<body>
  <main>
    <h1>Algeria</h1>

    <figure>
      <img
        src="map.png"
        alt="Map of Algeria"
        width="1000"
        height="1000"
        usemap="#algeria"
      >

      <map name="algeria">
        <area
          shape="circle"
          coords="398,110,70"
          href="oran.html"
          alt="Oran"
          title="Oran"
        >

        <area
          shape="circle"
          coords="574,59,70"
          href="alger.html"
          alt="Alger"
          title="Alger"
        >

        <area
          shape="circle"
          coords="692,725,90"
          href="tamanrasset.html"
          alt="Tamanrasset"
          title="Tamanrasset"
        >
      </map>

      <figcaption>Click Oran, Alger, or Tamanrasset.</figcaption>
    </figure>
  </main>
</body>
</html>
